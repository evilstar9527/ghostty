name: Release Branch

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Ghostty++
    runs-on: macos-26
    environment: develop
    timeout-minutes: 120
    env:
      ZIG_LOCAL_CACHE_DIR: /Users/runner/zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /Users/runner/zig/global-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be X.Y.Z, got: $VERSION"
            exit 1
          fi

          BUILD="$(git rev-list --count HEAD)"
          COMMIT="$(git rev-parse --short HEAD)"
          COMMIT_LONG="$(git rev-parse HEAD)"
          TAG="ghostty-plus-plus-v${VERSION}"
          DMG_NAME="Ghostty++-v${VERSION}.dmg"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "commit_long=$COMMIT_LONG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Check release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag already exists: ${TAG}"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release already exists: ${TAG}"
            exit 1
          fi

      - name: Validate Sparkle secrets
        env:
          MACOS_SPARKLE_PRIVATE_KEY: ${{ secrets.MACOS_SPARKLE_PRIVATE_KEY }}
          MACOS_SPARKLE_PUBLIC_KEY: ${{ secrets.MACOS_SPARKLE_PUBLIC_KEY }}
        run: |
          : "${MACOS_SPARKLE_PRIVATE_KEY:?missing MACOS_SPARKLE_PRIVATE_KEY}"
          : "${MACOS_SPARKLE_PUBLIC_KEY:?missing MACOS_SPARKLE_PUBLIC_KEY}"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Setup Sparkle
        env:
          SPARKLE_VERSION: 2.9.0
        run: |
          mkdir -p .action/sparkle
          cd .action/sparkle
          curl -L "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip" > sparkle.zip
          unzip sparkle.zip
          echo "$(pwd)/bin" >> "$GITHUB_PATH"

      - name: Build GhosttyKit
        env:
          GHOSTTY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          nix develop -c \
            zig build \
            -Doptimize=ReleaseFast \
            -Demit-macos-app=false \
            -Dversion-string="${GHOSTTY_VERSION}"

      - name: Build Ghostty++.app
        run: |
          cd macos
          xcodebuild \
            -project Ghostty.xcodeproj \
            -scheme Ghostty \
            -configuration Release \
            SYMROOT="$PWD/build" \
            build

      - name: Patch Info.plist
        env:
          GHOSTTY_VERSION: ${{ steps.version.outputs.version }}
          GHOSTTY_BUILD: ${{ steps.version.outputs.build }}
          GHOSTTY_COMMIT: ${{ steps.version.outputs.commit }}
          SPARKLE_KEY_PUB: ${{ secrets.MACOS_SPARKLE_PUBLIC_KEY }}
        run: |
          APP="macos/build/Release/Ghostty++.app"
          if [[ ! -d "$APP" ]]; then
            APP="macos/build/Release/Ghostty.app"
          fi
          if [[ ! -d "$APP" ]]; then
            echo "Could not find built app bundle"
            exit 1
          fi

          INFO="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :GhosttyBuild $GHOSTTY_BUILD" "$INFO"
          /usr/libexec/PlistBuddy -c "Set :GhosttyCommit $GHOSTTY_COMMIT" "$INFO"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GHOSTTY_BUILD" "$INFO"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $GHOSTTY_VERSION" "$INFO"
          /usr/libexec/PlistBuddy -c "Set :SUPublicEDKey $SPARKLE_KEY_PUB" "$INFO"
          /usr/libexec/PlistBuddy -c "Set :SUEnableAutomaticChecks true" "$INFO" || \
            /usr/libexec/PlistBuddy -c "Add :SUEnableAutomaticChecks bool true" "$INFO"
          echo "GHOSTTY_APP=$APP" >> "$GITHUB_ENV"

      - name: Ad-hoc codesign app bundle
        run: |
          nested_code=(
            "$GHOSTTY_APP/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc"
            "$GHOSTTY_APP/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc"
            "$GHOSTTY_APP/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
            "$GHOSTTY_APP/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app"
            "$GHOSTTY_APP/Contents/Frameworks/Sparkle.framework"
            "$GHOSTTY_APP/Contents/PlugIns/DockTilePlugin.plugin"
          )

          for path in "${nested_code[@]}"; do
            if [[ -e "$path" ]]; then
              /usr/bin/codesign --verbose --force --sign - --options runtime "$path"
            fi
          done

          /usr/bin/codesign \
            --verbose \
            --force \
            --sign - \
            --options runtime \
            --entitlements "macos/GhosttyReleaseLocal.entitlements" \
            "$GHOSTTY_APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$GHOSTTY_APP"

      - name: Create DMG
        env:
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
        run: |
          npm install --global create-dmg
          create-dmg \
            "$GHOSTTY_APP" \
            ./
          mv ./Ghostty*.dmg "./${DMG_NAME}"

      - name: Generate appcast
        env:
          GHOSTTY_VERSION: ${{ steps.version.outputs.version }}
          GHOSTTY_BUILD: ${{ steps.version.outputs.build }}
          GHOSTTY_COMMIT: ${{ steps.version.outputs.commit }}
          GHOSTTY_COMMIT_LONG: ${{ steps.version.outputs.commit_long }}
          GHOSTTY_RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GHOSTTY_DMG_NAME: ${{ steps.version.outputs.dmg_name }}
          MACOS_SPARKLE_PRIVATE_KEY: ${{ secrets.MACOS_SPARKLE_PRIVATE_KEY }}
        run: |
          printf '%s' "$MACOS_SPARKLE_PRIVATE_KEY" > signing.key
          sign_update -f signing.key "$GHOSTTY_DMG_NAME" > sign_update.txt
          python3 ./dist/macos/update_appcast_github.py
          test -f appcast.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ghostty++ v${{ steps.version.outputs.version }}
          body: |
            Ghostty++ v${{ steps.version.outputs.version }}

            Built from `${{ steps.version.outputs.commit_long }}`.
          files: |
            ${{ steps.version.outputs.dmg_name }}
            appcast.xml
          prerelease: false
          make_latest: true
